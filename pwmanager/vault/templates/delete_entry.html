{% extends "base.html" %}
{% block content %}
    <h1>Delete entry</h1>
    <p>Are you sure you want to delete the entry for {{ entry.site_url }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
    <p><a href="{% url 'index' %}">Cancel</a></p>
{% endblock %}
